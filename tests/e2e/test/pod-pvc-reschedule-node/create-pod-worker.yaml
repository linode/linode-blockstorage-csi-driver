apiVersion: v1
kind: Pod
metadata:
  name: e2e-pod
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist
  containers:
  - name: e2e-pod
    image: ubuntu
    command:
    - sleep
    - "1000000"
    volumeMounts:
    - mountPath: /data
      name: csi-volume
  volumes:
  - name: csi-volume
    persistentVolumeClaim:
      claimName: pvc-filesystem
